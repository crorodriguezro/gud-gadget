[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=--sysroot=/usr/aarch64-redhat-linux/sys-root/fc43", "-C", "link-arg=-static-libgcc"]

[env]
CC_aarch64-unknown-linux-gnu = "aarch64-linux-gnu-gcc"
CFLAGS_aarch64-unknown-linux-gnu = "--sysroot=/usr/aarch64-redhat-linux/sys-root/fc43"
