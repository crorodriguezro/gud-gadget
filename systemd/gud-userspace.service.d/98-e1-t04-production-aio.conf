[Service]
# Production exact-AIO configuration. A proven-idle FunctionFS DISABLE remains
# in this process; failures and contained ownership remain down.
UnsetEnvironment=GUD_TEST_PREARM_ONCE_BYTES
UnsetEnvironment=GUD_TEST_STATUS_ON_SET_BYTES
UnsetEnvironment=GUD_TEST_STATUS_ON_SET_TWO_TRANSACTIONS_BYTES
Environment=GUD_RECEIVE_MODE=status-on-set-aio
Environment=GUD_FFS_READ_SIZE=16384
Environment=GUD_TEST_COMPRESSION=none
Environment=GUD_TEST_MAX_BUFFER_SIZE=12800
Environment=GUD_TEST_OUTPUT_MODE=1280x720
Environment=GUD_TRANSFER_FORMAT=xrgb8888
Environment=GUD_FRAME_DUMP_MODE=disabled
Environment=GUD_PATTERN_MODE=off
Environment=RUST_LOG=debug
Restart=no
