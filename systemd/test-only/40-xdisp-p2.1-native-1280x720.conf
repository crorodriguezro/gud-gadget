# XDISP-P2.1 native-scanout performance gate only.
#
# Select an actual 1280x720 HDMI mode on the Pi so a 1280x720 GUD source uses
# the direct scanout-copy path instead of full-panel software scaling and a
# back-buffer swap for every SET_BUFFER rectangle.
#
# This changes only the physical DRM output mode. Normal behavior is unchanged
# when this drop-in is absent. Install only for the controlled native-mode gate.
[Service]
Environment=GUD_TEST_OUTPUT_MODE=1280x720
