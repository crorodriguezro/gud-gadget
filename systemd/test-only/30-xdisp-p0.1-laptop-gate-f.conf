# XDISP-P0.1 laptop Gate F only: decouple host tiling from Pi read size.
#
# Leave GUD_TEST_COMPRESSION and GUD_TEST_MAX_BUFFER_SIZE unset so the gadget
# advertises its normal LZ4 support and natural framebuffer-sized buffer.
# Only cap each blocking FunctionFS read request at the laptop-qualified
# 12,800-byte boundary. This tests whether large host updates can be consumed
# safely in multiple small reads without the severe small-tile control cadence.
# Install only for this gate and remove it before normal use.
[Service]
Environment=GUD_FFS_READ_SIZE=12800
