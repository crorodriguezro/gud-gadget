# XDISP-P0.1 laptop Gate D only: uncompressed short-final-packet control.
# At cached 1920 width, 11,520 bytes forms a 1920x3 RGB565 tile: 22 full
# 512-byte packets plus one 256-byte short packet.
# This gate is invalid if the first SET_BUFFER is not 1920x3/11,520 bytes.
# Install only for this gate and remove it before normal use.
[Service]
Environment=GUD_TEST_COMPRESSION=none
Environment=GUD_TEST_MAX_BUFFER_SIZE=11520
