# XDISP-P2.1 dynamic physical-mode matching gate only.
#
# Exact complete-timing matches may select a matching physical DRM mode.
# Synthetic/non-exact modes and every preparation/switch failure retain the
# aspect-fit scaler. Remove this file to restore normal fixed-mode behavior.
[Service]
Environment=GUD_TEST_DYNAMIC_MODE_MATCH=1
Environment=RUST_LOG=debug
