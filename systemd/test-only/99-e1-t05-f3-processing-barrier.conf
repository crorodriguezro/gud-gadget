# E1-T05 F3 only: debug build pauses once after exact completion enters
# Processing. Creating the release marker injects containment; remove before
# any production boot.
[Service]
Environment=GUD_TEST_E1_T05_PROCESSING_BARRIER=processing-before-idle
Environment=GUD_TEST_E1_T05_PROCESSING_BARRIER_DIR=/tmp/e1-t05-f3-processing-barrier
