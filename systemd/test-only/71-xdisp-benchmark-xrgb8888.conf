# Complete environment for controlled XRGB8888 XDISP benchmarks.
# Install only at an Idle, detached service-mutation boundary.
[Service]
Environment=GUD_FRAME_DUMP_MODE=disabled
Environment=GUD_FFS_READ_SIZE=16384
Environment=GUD_TEST_OUTPUT_MODE=1280x720
Environment=GUD_TRANSFER_FORMAT=xrgb8888
Environment=GUD_PATTERN_MODE=off
Environment=RUST_LOG=debug
