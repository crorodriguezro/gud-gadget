# XDISP-P0.1 laptop Gate C only: one-read uncompressed length boundary.
# 15,360 bytes is complete-row and packet aligned at both 1280 and 1920 width.
# Install only for this gate and remove it before normal use.
[Service]
Environment=GUD_TEST_COMPRESSION=none
Environment=GUD_TEST_MAX_BUFFER_SIZE=15360
