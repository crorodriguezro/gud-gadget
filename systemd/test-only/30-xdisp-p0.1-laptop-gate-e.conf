# XDISP-P0.1 laptop Gate E only: aligned lower-boundary control.
# At 1280 width, 12,800 bytes forms a 1280x5 RGB565 tile of exactly
# 25 high-speed 512-byte packets.
# Interpret this gate only after observing 1280x5/12,800-byte SET_BUFFERs.
# Install only for this gate and remove it before normal use.
[Service]
Environment=GUD_TEST_COMPRESSION=none
Environment=GUD_TEST_MAX_BUFFER_SIZE=12800
