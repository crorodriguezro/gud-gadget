[package]
name = "gud-viewer-gtk"
version = "0.1.0"
edition = "2021"

[features]
default = []
gtk-runtime = [
    "dep:glib",
    "dep:gtk4",
    "dep:libadwaita",
    "dep:libc",
    "dep:memmap2",
    "dep:serde_json",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "gud-viewer-gtk"
path = "src/main.rs"
required-features = ["gtk-runtime"]

[dependencies]
anyhow = "1.0.100"
glib = { version = "0.22.2", optional = true }
gtk4 = { version = "0.11.0", optional = true }
libadwaita = { version = "0.9.1", optional = true }
libc = { version = "0.2.177", optional = true }
memmap2 = { version = "0.9.9", optional = true }
serde_json = { version = "1.0.145", optional = true }
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"], optional = true }
viewer-ipc = { path = "../viewer-ipc" }
